<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Planning Poker - set number of voters</title>
</head>
<body>
    <h1>Set Number of Voters</h1>
    <form method="POST" action="/set_voters">
        <label for="no_voters">Number of voters:</label>
        <input type="number" id="no_voters" name="no_voters" min="1" required value="{{ no_voters }}">
        <button type="submit">Set</button>
    </form>
</body>
</html>
