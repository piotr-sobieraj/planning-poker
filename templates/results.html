<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Planning Poker - results</title>
</head>
<body>
    <h1>Planning Poker - results</h1>
    
    <h3 id="waiting-message">Waiting for all voters...</h3>
    <ul id="results-list" style="display: none;">
        <!-- Wyniki są dodawane przez JavaScript -->
    </ul>
    
    <!-- Formularz do resetowania wyników -->
    <form method="POST" action="/reset">
        <button type="submit">Reset</button>
    </form>

    <script>
        // Funkcja do pobierania wyników z serwera i aktualizacji listy
        function fetchResults() {
            fetch('/get_results')
                .then(response => response.json())
                .then(data => {
                    const resultsList = document.getElementById('results-list');
                    const waitingMessage = document.getElementById('waiting-message');

                    // Czyszczenie listy
                    resultsList.innerHTML = '';

                    // Sprawdzenie liczby głosów
                    const noVoters = data.no_voters; // Wymagana liczba głosów
                    const votes = data.votes; // Liczba oddanych głosów

                    if (votes >= noVoters) {
                        // Wyświetl wyniki, jeśli wszyscy zagłosowali
                        waitingMessage.style.display = 'none';
                        resultsList.style.display = 'block';

                        data.results.forEach(result => {
                            const listItem = document.createElement('li');
                            listItem.textContent = `${result.name}: ${result.points}`;
                            resultsList.appendChild(listItem);
                        });
                    } else {
                        // Ukryj wyniki, jeśli głosowanie trwa
                        waitingMessage.style.display = 'block';
                        waitingMessage.textContent = `Waiting for all voters (${votes}/${noVoters})...`;
                        resultsList.style.display = 'none';
                    }
                });
        }

        // Ustawienie interwału do pobierania wyników co sekundę
        setInterval(fetchResults, 1000);

        // Pierwsze wywołanie funkcji po załadowaniu strony
        fetchResults();
    </script>
</body>
</html>
